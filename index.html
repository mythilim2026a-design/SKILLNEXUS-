<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Nexus – Industry SkillBridge | Skill Intelligence & Opportunity Matching</title>
  <meta name="description" content="Skill Nexus connects Students, Industries, and Institutions through precision skill intelligence, automated gap analysis, and closed-loop opportunity matching.">
  <meta name="keywords" content="Skill Nexus, Industry SkillBridge, Student Upskilling, Skill Gap Analysis, Internship Matching">
  <meta name="author" content="Skill Nexus Team">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Application Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo-icon" onclick="setRole('landing')" style="cursor: pointer;" title="Back to Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6l2.1-2.1"/>
        </svg>
      </div>
      <div class="brand-titles">
        <div class="brand-name">
          Skill Nexus
          <span class="brand-subtitle-badge">Industry SkillBridge</span>
        </div>
        <div class="brand-tagline-text">"Know what to learn. Know where to apply. Know what industry needs."</div>
      </div>
    </div>

    <!-- Header Actions & Role Switcher -->
    <div class="header-actions">
      <!-- Guided Demo Tour Button -->
      <button class="tour-guide-btn" onclick="openDemoGuideModal()" title="View Step-by-Step Demo Flow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/>
        </svg>
        <span>Demo Flow Guide</span>
      </button>

      <!-- Persistent Fast Role Switcher (Student / Industry / Institution) -->
      <div class="role-switcher-box">
        <button class="role-switch-btn" data-role="student" onclick="setRole('student')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          </svg>
          <span>Student</span>
        </button>
        <button class="role-switch-btn" data-role="industry" onclick="setRole('industry')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          </svg>
          <span>Industry</span>
        </button>
        <button class="role-switch-btn" data-role="institution" onclick="setRole('institution')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18M3 10h18M5 6l7-3 7 3"/>
          </svg>
          <span>Institution</span>
        </button>
      </div>

      <!-- Current User Context Pill -->
      <div class="user-selector-container">
        <div class="current-user-pill" id="headerUserPill" title="Switch User or View Details">
          <!-- Populated dynamically by renderHeader() -->
        </div>
      </div>

      <!-- Reset Demo Data Button -->
      <button class="reset-data-btn" onclick="resetAllDemoData()" title="Reset all demo data to pristine state">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Reset Data</span>
      </button>

      <!-- Open Fresh Tab Helper -->
      <a href="http://localhost:8080/" target="_blank" class="reset-data-btn" title="Open application in a new browser tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>Open Tab</span>
      </a>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-profile-card" id="sidebarProfile">
        <!-- Profile info rendered dynamically based on active role -->
      </div>

      <ul class="sidebar-nav-list" id="sidebarNavList">
        <!-- Navigation items rendered dynamically based on active role -->
      </ul>

      <div class="sidebar-footer">
        <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="Toggle Sidebar Width">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>Collapse Sidebar</span>
        </button>
      </div>
    </aside>

    <!-- Main Viewport Content Area -->
    <main id="mainViewport" class="main-viewport">
      <!-- Main view rendered dynamically based on state.currentView -->
    </main>
  </div>

  <!-- Global Modal Dialog Overlay -->
  <div class="modal-overlay" id="globalModalOverlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Skill Nexus Dialog</h3>
        <button class="modal-close-btn" onclick="closeModal()" title="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
